<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="920" height="230" rx="16" fill="#090d16" stroke="#334155" stroke-width="1.5"/>

  <!-- Header Bar -->
  <g transform="translate(20, 16)">
    <rect width="880" height="34" rx="8" fill="#1e293b" opacity="0.7"/>
    <text x="14" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">
      Régua de Vencimentos • Mês Selecionado:
    </text>
    <!-- Dropdown Mock -->
    <rect x="235" y="7" width="90" height="20" rx="4" fill="#0f172a" stroke="#475569"/>
    <text x="245" y="21" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Outubro ▾</text>

    <!-- Badges Counters -->
    <rect x="520" y="7" width="95" height="20" rx="10" fill="#065f46" opacity="0.3"/>
    <text x="567" y="21" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">✓ 3 Pagas</text>

    <rect x="625" y="7" width="100" height="20" rx="10" fill="#881337" opacity="0.3"/>
    <text x="675" y="21" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">! 1 Vencida</text>

    <rect x="735" y="7" width="135" height="20" rx="10" fill="#0284c7" opacity="0.2"/>
    <text x="802" y="21" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">⏳ 2 A Vencer</text>
  </g>

  <!-- 4 Demo Cards -->
  <!-- Card 1: PAGA (Verde) -->
  <g transform="translate(20, 64)">
    <rect width="208" height="145" rx="12" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5"/>
    <text x="14" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Aluguel &amp; Condomínio</text>
    <text x="14" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Custo Fixo</text>

    <!-- Badge Paga -->
    <rect x="135" y="12" width="60" height="18" rx="9" fill="#065f46" stroke="#10b981" stroke-width="0.8"/>
    <text x="165" y="25" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">✓ Paga</text>

    <!-- Valor -->
    <line x1="14" y1="48" x2="194" y2="48" stroke="#334155" opacity="0.6"/>
    <text x="14" y="74" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="800">R$ 1.500,00</text>
    <line x1="14" y1="88" x2="194" y2="88" stroke="#334155" opacity="0.6"/>

    <!-- Vencimento & Botão -->
    <text x="14" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Venc.: 10/10/2026</text>
    <rect x="14" y="120" width="180" height="22" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
    <text x="104" y="135" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✓ Pago (Baixado)</text>
  </g>

  <!-- Card 2: VENCIDA (Vermelha) -->
  <g transform="translate(244, 64)">
    <rect width="208" height="145" rx="12" fill="url(#cardBg)" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="14" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Energia Elétrica</text>
    <text x="14" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Custo Fixo</text>

    <!-- Badge Vencida -->
    <rect x="125" y="12" width="70" height="18" rx="9" fill="#881337" stroke="#f43f5e" stroke-width="0.8"/>
    <text x="160" y="25" fill="#f87171" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">! Vencida</text>

    <!-- Valor -->
    <line x1="14" y1="48" x2="194" y2="48" stroke="#334155" opacity="0.6"/>
    <text x="14" y="74" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="800">R$ 180,00</text>
    <line x1="14" y1="88" x2="194" y2="88" stroke="#334155" opacity="0.6"/>

    <!-- Vencimento & Botão -->
    <text x="14" y="112" fill="#f87171" font-family="system-ui, sans-serif" font-size="10">Venc.: 15/10/2026 (Atraso)</text>
    <rect x="14" y="120" width="180" height="22" rx="6" fill="#e11d48"/>
    <text x="104" y="135" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Pagar (Dar Baixa)</text>
  </g>

  <!-- Card 3: VENCE HOJE (Laranja) -->
  <g transform="translate(468, 64)">
    <rect width="208" height="145" rx="12" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="14" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Internet Fibra</text>
    <text x="14" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Custo Fixo</text>

    <!-- Badge Vence Hoje -->
    <rect x="115" y="12" width="80" height="18" rx="9" fill="#78350f" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="155" y="25" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">⏳ Vence Hoje</text>

    <!-- Valor -->
    <line x1="14" y1="48" x2="194" y2="48" stroke="#334155" opacity="0.6"/>
    <text x="14" y="74" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="800">R$ 120,00</text>
    <line x1="14" y1="88" x2="194" y2="88" stroke="#334155" opacity="0.6"/>

    <!-- Vencimento & Botão -->
    <text x="14" y="112" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10">Venc.: Hoje (Dia 28)</text>
    <rect x="14" y="120" width="180" height="22" rx="6" fill="#d97706"/>
    <text x="104" y="135" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Pagar (Dar Baixa)</text>
  </g>

  <!-- Card 4: A VENCER (Azul) -->
  <g transform="translate(692, 64)">
    <rect width="208" height="145" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="14" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Supermercado</text>
    <text x="14" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Custo Variável</text>

    <!-- Badge A Vencer -->
    <rect x="120" y="12" width="75" height="18" rx="9" fill="#0c4a6e" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="157" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">✓ A Vencer</text>

    <!-- Valor -->
    <line x1="14" y1="48" x2="194" y2="48" stroke="#334155" opacity="0.6"/>
    <text x="14" y="74" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="800">R$ 450,00</text>
    <line x1="14" y1="88" x2="194" y2="88" stroke="#334155" opacity="0.6"/>

    <!-- Vencimento & Botão -->
    <text x="14" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Venc.: 30/10/2026</text>
    <rect x="14" y="120" width="180" height="22" rx="6" fill="#334155"/>
    <text x="104" y="135" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Pagar (Dar Baixa)</text>
  </g>
</svg>
