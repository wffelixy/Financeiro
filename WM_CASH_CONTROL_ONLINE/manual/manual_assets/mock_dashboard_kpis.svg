<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="greenFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="roseFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="920" height="340" rx="16" fill="#090d16" stroke="#334155" stroke-width="1.5"/>

  <!-- Top bar demo indicator -->
  <rect x="20" y="16" width="880" height="32" rx="8" fill="#1e293b" opacity="0.6"/>
  <circle cx="36" cy="32" r="5" fill="#38bdf8"/>
  <text x="50" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">
    PAINEL EXECUTIVO • INDICADORES ANUAIS E MENSAIS (EXEMPLO ILUSTRATIVO)
  </text>
  <rect x="800" y="21" width="90" height="22" rx="6" fill="#0284c7" opacity="0.2"/>
  <text x="845" y="36" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Ano: 2026</text>

  <!-- 4 KPI Cards -->
  <!-- KPI 1: Receita -->
  <g transform="translate(20, 60)">
    <rect width="208" height="92" rx="12" fill="url(#cardGrad)" stroke="#334155"/>
    <text x="16" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">RECEITA TOTAL ANUAL</text>
    <text x="16" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">R$ 60.000,00</text>
    <text x="16" y="76" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">Média: R$ 5.000,00/mês</text>
    <circle cx="180" cy="30" r="14" fill="#065f46" opacity="0.5"/>
    <text x="180" y="34" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">↑</text>
  </g>

  <!-- KPI 2: Despesas -->
  <g transform="translate(244, 60)">
    <rect width="208" height="92" rx="12" fill="url(#cardGrad)" stroke="#334155"/>
    <text x="16" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">DESPESAS TOTAIS</text>
    <text x="16" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">R$ 42.000,00</text>
    <text x="16" y="76" fill="#f87171" font-family="system-ui, sans-serif" font-size="11">Média: R$ 3.500,00/mês</text>
    <circle cx="180" cy="30" r="14" fill="#881337" opacity="0.5"/>
    <text x="180" y="34" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">↓</text>
  </g>

  <!-- KPI 3: Sobra -->
  <g transform="translate(468, 60)">
    <rect width="208" height="92" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2"/>
    <text x="16" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">SOBRA ANUAL LÍQUIDA</text>
    <text x="16" y="55" fill="#34d399" font-family="system-ui, sans-serif" font-size="20" font-weight="800">R$ 18.000,00</text>
    <text x="16" y="76" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">Taxa de Poupança: 30.0%</text>
    <circle cx="180" cy="30" r="14" fill="#047857" opacity="0.4"/>
    <text x="180" y="34" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✓</text>
  </g>

  <!-- KPI 4: Comprometimento -->
  <g transform="translate(692, 60)">
    <rect width="208" height="92" rx="12" fill="url(#cardGrad)" stroke="#334155"/>
    <text x="16" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">COMPROMETIMENTO</text>
    <text x="16" y="55" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="800">70%</text>
    <text x="16" y="76" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Saúde Financeira: Estável</text>
    <circle cx="180" cy="30" r="14" fill="#0284c7" opacity="0.3"/>
    <text x="180" y="34" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">%</text>
  </g>

  <!-- Mini Chart Evolução Mensal -->
  <g transform="translate(20, 168)">
    <rect width="880" height="152" rx="12" fill="url(#cardGrad)" stroke="#334155"/>
    <text x="20" y="26" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">
      Evolução Mensal: Receitas vs Despesas (12 Meses)
    </text>

    <!-- Legend -->
    <rect x="670" y="16" width="10" height="10" rx="2" fill="#10b981"/>
    <text x="686" y="25" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Receitas</text>
    <rect x="760" y="16" width="10" height="10" rx="2" fill="#f43f5e"/>
    <text x="776" y="25" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Despesas</text>

    <!-- Chart grid lines -->
    <line x1="40" y1="50" x2="850" y2="50" stroke="#334155" stroke-dasharray="2,3" opacity="0.4"/>
    <line x1="40" y1="85" x2="850" y2="85" stroke="#334155" stroke-dasharray="2,3" opacity="0.4"/>
    <line x1="40" y1="120" x2="850" y2="120" stroke="#334155" stroke-dasharray="2,3" opacity="0.4"/>

    <!-- Receita Area / Path (Green) -->
    <path d="M 50 60 Q 180 58, 250 55 T 450 52 T 650 50 T 840 50 L 840 125 L 50 125 Z" fill="url(#greenFill)"/>
    <path d="M 50 60 Q 180 58, 250 55 T 450 52 T 650 50 T 840 50" fill="none" stroke="#10b981" stroke-width="2.5"/>

    <!-- Despesa Area / Path (Rose) -->
    <path d="M 50 95 Q 180 90, 250 96 T 450 88 T 650 92 T 840 85 L 840 125 L 50 125 Z" fill="url(#roseFill)"/>
    <path d="M 50 95 Q 180 90, 250 96 T 450 88 T 650 92 T 840 85" fill="none" stroke="#f43f5e" stroke-width="2.5"/>

    <!-- Month Labels -->
    <g fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">
      <text x="50" y="140">Jan</text>
      <text x="122" y="140">Fev</text>
      <text x="194" y="140">Mar</text>
      <text x="266" y="140">Abr</text>
      <text x="338" y="140">Mai</text>
      <text x="410" y="140">Jun</text>
      <text x="482" y="140">Jul</text>
      <text x="554" y="140">Ago</text>
      <text x="626" y="140">Set</text>
      <text x="698" y="140">Out</text>
      <text x="770" y="140">Nov</text>
      <text x="842" y="140">Dez</text>
    </g>
  </g>
</svg>
