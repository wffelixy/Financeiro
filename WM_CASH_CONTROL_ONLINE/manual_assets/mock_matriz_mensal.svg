<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <linearGradient id="tblBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="920" height="380" rx="16" fill="url(#tblBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Summary Cards (Demonstração) -->
  <g transform="translate(18, 16)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="205" height="58" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="12" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">TOTAL DESPESAS (ANO)</text>
    <text x="12" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">R$ 42.000,00</text>

    <!-- Card 2 -->
    <rect x="220" y="0" width="205" height="58" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <text x="12" y="20" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="600">TOTAL JÁ PAGO</text>
    <text x="12" y="44" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="800">R$ 28.000,00 <tspan font-size="11" font-weight="normal">(66.7%)</tspan></text>

    <!-- Card 3 -->
    <rect x="440" y="0" width="205" height="58" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="12" y="20" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" font-weight="600">FALTA PAGAR (ABERTO)</text>
    <text x="12" y="44" fill="#f87171" font-family="system-ui, sans-serif" font-size="16" font-weight="800">R$ 14.000,00 <tspan font-size="11" font-weight="normal">(33.3%)</tspan></text>

    <!-- Card 4: Legenda -->
    <rect x="660" y="0" width="224" height="58" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="12" y="18" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="700">LEGENDA DAS BOLINHAS:</text>
    <!-- Dot 1 -->
    <circle cx="18" cy="32" r="4.5" fill="#10b981"/>
    <text x="27" y="35" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Paga</text>
    <!-- Dot 2 -->
    <circle cx="68" cy="32" r="4.5" fill="#f43f5e"/>
    <text x="77" y="35" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Vencida</text>
    <!-- Dot 3 -->
    <circle cx="128" cy="32" r="4.5" fill="#f59e0b"/>
    <text x="137" y="35" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Hoje</text>
    <!-- Dot 4 -->
    <circle cx="178" cy="32" r="4.5" fill="#38bdf8"/>
    <text x="187" y="35" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">A Vencer</text>
    <text x="12" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5" font-style="italic">Clique na bolinha para dar baixa</text>
  </g>

  <!-- Table Container Mock -->
  <g transform="translate(18, 90)">
    <!-- Header Row -->
    <rect x="0" y="0" width="884" height="32" fill="#020617" stroke="#334155"/>
    <text x="14" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Conta / Categoria</text>
    <text x="190" y="20" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Jan</text>
    <text x="250" y="20" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Fev</text>
    <text x="310" y="20" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Mar</text>
    <text x="370" y="20" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">...</text>
    <text x="430" y="20" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Set</text>
    <text x="500" y="20" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Out (Mês)</text>
    <text x="575" y="20" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Nov</text>
    <text x="645" y="20" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Dez</text>
    <text x="760" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Total Anual</text>

    <!-- Row 1: Aluguel Residencial -->
    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="884" height="42" fill="#1e293b" opacity="0.6"/>
      <text x="14" y="19" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Aluguel Residencial</text>
      <text x="14" y="33" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Custo Fixo • Dia 10</text>
      
      <!-- Jan (Paga) -->
      <circle cx="166" cy="21" r="5" fill="#10b981"/>
      <text x="195" y="24" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">1.500</text>

      <!-- Fev (Paga) -->
      <circle cx="226" cy="21" r="5" fill="#10b981"/>
      <text x="255" y="24" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">1.500</text>

      <!-- Mar (Paga) -->
      <circle cx="286" cy="21" r="5" fill="#10b981"/>
      <text x="315" y="24" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">1.500</text>

      <text x="370" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">...</text>

      <!-- Set (Paga) -->
      <circle cx="406" cy="21" r="5" fill="#10b981"/>
      <text x="435" y="24" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">1.500</text>

      <!-- Out (Paga agora) -->
      <circle cx="476" cy="21" r="5.5" fill="#10b981"/>
      <text x="505" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">1.500</text>

      <!-- Nov (A Vencer) -->
      <circle cx="555" cy="21" r="4.5" fill="#0284c7" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="580" y="24" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">1.500</text>

      <!-- Dez (A Vencer) -->
      <circle cx="625" cy="21" r="4.5" fill="#0284c7" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="650" y="24" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">1.500</text>

      <!-- Total Anual Row -->
      <text x="760" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">R$ 18.000,00</text>
      <text x="760" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Pago: 15.000 | Falta: 3.000</text>
    </g>

    <!-- Row 2: Energia Elétrica (com mês vencido vermelho) -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="884" height="42" fill="#0f172a" opacity="0.6"/>
      <text x="14" y="19" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Energia Elétrica</text>
      <text x="14" y="33" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Custo Fixo • Dia 15</text>

      <!-- Jan a Set: Paga -->
      <circle cx="166" cy="21" r="5" fill="#10b981"/>
      <text x="195" y="24" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">180</text>

      <circle cx="226" cy="21" r="5" fill="#10b981"/>
      <text x="255" y="24" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">195</text>

      <circle cx="286" cy="21" r="5" fill="#10b981"/>
      <text x="315" y="24" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">175</text>

      <text x="370" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">...</text>

      <circle cx="406" cy="21" r="5" fill="#10b981"/>
      <text x="435" y="24" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">185</text>

      <!-- Out: VENCIDA (Vermelha) -->
      <circle cx="476" cy="21" r="6" fill="#f43f5e"/>
      <text x="505" y="24" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">180</text>

      <!-- Nov/Dez: A Vencer -->
      <circle cx="555" cy="21" r="4.5" fill="#0284c7" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="580" y="24" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">180</text>

      <circle cx="625" cy="21" r="4.5" fill="#0284c7" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="650" y="24" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">180</text>

      <!-- Total Anual Row -->
      <text x="760" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">R$ 2.180,00</text>
      <text x="760" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Pago: 1.640 | Falta: 540</text>
    </g>

    <!-- Footer Rows Mock -->
    <!-- Total Despesas -->
    <g transform="translate(0, 122)">
      <rect x="0" y="0" width="884" height="26" fill="#78350f" opacity="0.3"/>
      <text x="14" y="17" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Total Despesas</text>
      <text x="505" y="17" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">3.500,00</text>
      <text x="760" y="17" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">42.000,00</text>
    </g>

    <!-- Já Pago (Verde) -->
    <g transform="translate(0, 149)">
      <rect x="0" y="0" width="884" height="26" fill="#065f46" opacity="0.3"/>
      <text x="14" y="17" fill="#34d399" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">🟢 Já Pago</text>
      <text x="505" y="17" fill="#34d399" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">2.330,00</text>
      <text x="760" y="17" fill="#34d399" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">28.000,00</text>
    </g>

    <!-- Falta Pagar (Vermelho) -->
    <g transform="translate(0, 176)">
      <rect x="0" y="0" width="884" height="26" fill="#881337" opacity="0.3"/>
      <text x="14" y="17" fill="#f87171" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">🔴 Falta Pagar</text>
      <text x="505" y="17" fill="#f87171" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">1.170,00</text>
      <text x="760" y="17" fill="#f87171" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">14.000,00</text>
    </g>

    <!-- Receita Total -->
    <g transform="translate(0, 203)">
      <rect x="0" y="0" width="884" height="26" fill="#065f46" opacity="0.2"/>
      <text x="14" y="17" fill="#34d399" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Receita Total</text>
      <text x="505" y="17" fill="#34d399" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">5.000,00</text>
      <text x="760" y="17" fill="#34d399" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">60.000,00</text>
    </g>

    <!-- Sobra Mensal -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="884" height="26" fill="#0f172a"/>
      <text x="14" y="17" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Sobra Líquida</text>
      <text x="505" y="17" fill="#34d399" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">+1.500,00</text>
      <text x="760" y="17" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">+18.000,00</text>
    </g>
  </g>
</svg>
