<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 70" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMenu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background bar -->
  <rect width="900" height="70" rx="12" fill="url(#bgMenu)" stroke="#334155" stroke-width="1.5"/>

  <!-- Tab 1: Dashboard Executivo (Active) -->
  <g transform="translate(20, 14)">
    <circle cx="16" cy="20" r="7" fill="none" stroke="#0284c7" stroke-width="2"/>
    <line x1="16" y1="20" x2="20" y2="16" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    <text x="32" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Dashboard Executivo</text>
    <!-- Active tab indicator line -->
    <rect x="0" y="40" width="200" height="3" rx="1.5" fill="#0284c7"/>
  </g>

  <!-- Tab 2: Matriz Mensal -->
  <g transform="translate(250, 14)">
    <!-- Table icon -->
    <rect x="10" y="12" width="14" height="14" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="10" y1="19" x2="24" y2="19" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="17" y1="12" x2="17" y2="26" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="32" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Matriz Mensal</text>
  </g>

  <!-- Tab 3: Onde Estou Errando? -->
  <g transform="translate(430, 14)">
    <!-- Magnifier icon -->
    <circle cx="16" cy="18" r="6" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
    <line x1="21" y1="23" x2="26" y2="28" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <text x="34" y="25" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Onde Estou Errando?</text>
    <!-- Badge ! -->
    <circle cx="190" cy="16" r="8" fill="#f43f5e"/>
    <text x="190" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">!</text>
  </g>

  <!-- Tab 4: Plano & Reserva -->
  <g transform="translate(680, 14)">
    <!-- Piggy bank / leaf icon -->
    <circle cx="16" cy="20" r="7" fill="none" stroke="#10b981" stroke-width="1.8"/>
    <text x="32" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Plano &amp; Reserva 50/30/20</text>
  </g>
</svg>
